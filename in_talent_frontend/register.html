<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InTalent - Registro de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <!-- Lado izquierdo: Formulario -->
        <div class="auth-form-section">
            <div class="logo-auth">In<span>Talent</span></div>
            <p class="auth-subtitle">Crea tu cuenta para empezar a conectar</p>

           <!-- Modificamos la etiqueta form para que apunte a tu backend -->
            <form id="register-form">
                
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <!-- Agregamos name="nombre" -->
                    <input type="text" name="nombre" placeholder="Tu nombre y apellido" required>
                </div>

                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <!-- Agregamos name="correo" -->
                    <input type="email" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <!-- Agregamos name="contrasena" -->
                    <input type="password" name="contrasena" placeholder="********" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Cuenta</label>
                    <!-- Agregamos name="tipo" -->
                    <select name="tipo" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <option value="">Selecciona una opción</option>
                        <option value="cliente">Cliente (Busco servicios)</option>
                        <option value="profesional">Profesional u Oficios (Ofrezco servicios)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <p class="auth-footer-text">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            <p class="auth-footer-text" style="margin-top: 10px;"><a href="index.html">← Volver al inicio</a></p>
        </div>

        <!-- Lado derecho: Imagen o panel decorativo (igual que el login) -->
        <div class="auth-image-section">
            <div class="auth-overlay">
                <h2>Únete a nuestra comunidad</h2>
                <p>Conecta con cientos de clientes o profesionales calificados en tu zona de forma rápida y segura.</p>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>

</body>


</html>
