<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - InTalent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* BARRA SUPERIOR */

        .barra-superior {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .boton-registro {
            color: white;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 9px 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .boton-registro:hover {
            background-color: rgba(255, 255, 255, 0.30);
        }

        /* ZONA DEL LOGIN */

        .zona-contenido {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .contenedor {
            width: 100%;
            max-width: 400px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-top: 0;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: #444;
        }

        /* FORMULARIO */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.15);
        }

        /* CAMPO DE CONTRASEÑA CON OJO */

        .campo-password {
            position: relative;
            width: 100%;
        }

        .campo-password input {
            width: 100%;
            padding: 10px 45px 10px 10px;
        }

        .boton-ojo {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            margin: 0;
            padding: 5px;
            border: none;
            background: transparent;
            color: #555;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .boton-ojo:hover {
            background: transparent;
            color: #007bff;
        }

        .boton-ojo svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* BOTÓN PRINCIPAL */

        button:not(.boton-ojo) {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:not(.boton-ojo):hover {
            background-color: #0056b3;
        }

        /* ENLACES */

        .enlace {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }

        .enlace:hover {
            text-decoration: underline;
        }

        /* SEPARADOR */

        .separador {
            text-align: center;
            margin: 20px 0;
            color: #777;
        }

        /* INVITADO */

        .invitado {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            border-radius: 5px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
        }

        .invitado:hover {
            background-color: #545b62;
        }

        /* MENSAJE DE ERROR */

        .mensaje {
            color: #dc3545;
            text-align: center;
            background-color: #fde8e8;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* CELULARES */

        @media (max-width: 600px) {
            .barra-superior {
                padding: 12px 15px;
            }

            .logo {
                font-size: 21px;
            }

            .boton-registro {
                padding: 8px 10px;
                font-size: 14px;
            }

            .contenedor {
                padding: 25px 20px;
            }
        }
    </style>

    <link rel="stylesheet" href="{% static 'css/intalent-ui.css' %}">
</head>

<body>

    <!-- BARRA SUPERIOR -->

    <div class="barra-superior">

        <div class="logo">
            InTalent
        </div>

        <a href="{% url 'registro' %}" class="boton-registro">
            👤 Registrarse
        </a>

    </div>

    <!-- CONTENIDO -->

    <div class="zona-contenido">

        <div class="contenedor">

            <h1>InTalent</h1>

            <h2>Iniciar sesión</h2>

            {% if mensaje %}
                <p class="mensaje">
                    {{ mensaje }}
                </p>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                >

                <label for="contraseña">
                    Contraseña
                </label>

                <div class="campo-password">

                    <input
                        type="password"
                        id="contraseña"
                        name="contraseña"
                        required
                    >

                    <button
                        type="button"
                        class="boton-ojo"
                        id="mostrarContraseña"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                        title="Mostrar contraseña"
                    >
                        <svg
                            id="iconoOjo"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>

                </div>

                <a
                    href="{% url 'recuperar_contraseña' %}"
                    class="enlace"
                >
                    🔑 ¿Olvidaste tu contraseña?
                </a>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <a href="{% url 'registro' %}" class="enlace">
                👤 Registrar usuario nuevo
            </a>

            <div class="separador">
                ───── o ─────
            </div>

            <a href="{% url 'invitado' %}" class="invitado">
                👀 Entrar como invitado
            </a>

        </div>

    </div>

    <!-- FUNCIONALIDAD MOSTRAR / OCULTAR CONTRASEÑA -->

    <script>
        const campoContraseña = document.getElementById('contraseña');
        const botonOjo = document.getElementById('mostrarContraseña');
        const iconoOjo = document.getElementById('iconoOjo');

        botonOjo.addEventListener('click', function () {

            const estaOculta = campoContraseña.type === 'password';

            campoContraseña.type = estaOculta ? 'text' : 'password';

            if (estaOculta) {

                iconoOjo.innerHTML = `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M3 3l18 18"></path>
                `;

                botonOjo.setAttribute('aria-label', 'Ocultar contraseña');
                botonOjo.setAttribute('title', 'Ocultar contraseña');
                botonOjo.setAttribute('aria-pressed', 'true');

            } else {

                iconoOjo.innerHTML = `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;

                botonOjo.setAttribute('aria-label', 'Mostrar contraseña');
                botonOjo.setAttribute('title', 'Mostrar contraseña');
                botonOjo.setAttribute('aria-pressed', 'false');

            }

        });
    </script>

</body>
</html>
