<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - InTalent</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }


        /* =========================
           BARRA SUPERIOR
        ========================= */

        .barra-superior {
            width: 100%;

            background-color: #007bff;

            color: white;

            padding: 15px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }


        .logo {
            font-size: 24px;
            font-weight: bold;
        }


        .boton-login {
            color: white;

            text-decoration: none;

            background-color: rgba(255, 255, 255, 0.15);

            padding: 9px 15px;

            border-radius: 6px;

            font-weight: bold;
        }


        .boton-login:hover {
            background-color: rgba(255, 255, 255, 0.30);
        }


        /* =========================
           CONTENEDOR
        ========================= */

        .zona-contenido {
            min-height: calc(100vh - 72px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;
        }


        .contenedor {
            width: 90%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

            text-align: center;
        }


        h1 {
            margin-bottom: 10px;
        }


        .descripcion {
            color: #666;

            margin-bottom: 25px;

            line-height: 1.5;
        }


        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }


        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {
            background: #0056b3;
        }


        .mensaje {
            margin-top: 20px;

            padding: 12px;

            background: #e8f5e9;

            color: #2e7d32;

            border-radius: 6px;
        }


        .volver {
            display: block;

            margin-top: 20px;

            color: #007bff;

            text-decoration: none;
        }


        .volver:hover {
            text-decoration: underline;
        }


        /* =========================
           CELULARES
        ========================= */

        @media (max-width: 600px) {

            .barra-superior {
                padding: 12px 15px;
            }

            .logo {
                font-size: 21px;
            }

            .boton-login {
                padding: 8px 10px;
                font-size: 14px;
            }

            .contenedor {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BARRA SUPERIOR
    ========================= -->

    <div class="barra-superior">

        <div class="logo">
            InTalent
        </div>


        <a
            href="{% url 'login' %}"
            class="boton-login"
        >
            🔐 Iniciar sesión
        </a>

    </div>



    <!-- =========================
         CONTENIDO
    ========================= -->

    <div class="zona-contenido">


        <div class="contenedor">


            <h1>
                Recuperar contraseña
            </h1>


            <p class="descripcion">

                Ingresa el correo electrónico asociado
                a tu cuenta de InTalent.

                Te enviaremos instrucciones para crear
                una nueva contraseña.

            </p>



            <form method="POST">

                {% csrf_token %}


                <input
                    type="email"
                    name="correo"
                    placeholder="Correo electrónico"
                    required
                >


                <button type="submit">

                    Enviar enlace de recuperación

                </button>

            </form>



            {% if mensaje %}

                <div class="mensaje">

                    {{ mensaje }}

                </div>

            {% endif %}



            <a
                href="{% url 'login' %}"
                class="volver"
            >

                ← Volver al inicio de sesión

            </a>


        </div>


    </div>


</body>

</html>
