<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - InTalent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>InTalent</h1>

        <p class="descripcion">
            Crea tu cuenta
        </p>

        <form method="POST">
            {% csrf_token %}

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <label for="apellido">Apellido</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                required
            >

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                required
            >

            <label for="telefono">Teléfono</label>
            <input
                type="tel"
                id="telefono"
                name="telefono"
                required
            >

            <label for="tipo_usuario">Tipo de usuario</label>

            <select
                id="tipo_usuario"
                name="tipo_usuario"
                required
            >
                <option value="">Selecciona una opción</option>
                <option value="cliente">Cliente</option>
                <option value="profesional">Profesional</option>
            </select>

            <button type="submit">
                Registrarme
            </button>

        </form>

    </div>

</body>

</html>
